apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wp-mysql-external
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: wp-mysql-secret
  data:
    - secretKey: mysql-password
      remoteRef:
        key: kubernetes/prod/wordpress-justinlauck
        property: database_password
    - secretKey: mysql-root-password
      remoteRef:
        key: kubernetes/prod/wordpress-justinlauck
        property: database_rootpassword
---
# WordPress auth keys/salts. Every property in the Vault secret becomes an env var, so the
# properties must be named WORDPRESS_AUTH_KEY, WORDPRESS_SECURE_AUTH_KEY, WORDPRESS_LOGGED_IN_KEY,
# WORDPRESS_NONCE_KEY, WORDPRESS_AUTH_SALT, WORDPRESS_SECURE_AUTH_SALT, WORDPRESS_LOGGED_IN_SALT
# and WORDPRESS_NONCE_SALT. Fixed values keep logins valid across pod restarts.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wp-salts-external
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: wp-salts
  dataFrom:
    - extract:
        key: kubernetes/prod/wp-justinlauck-salts
