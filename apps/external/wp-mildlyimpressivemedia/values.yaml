wordpress:
  enabled: true
  global:
    fullnameOverride: wordpress
  controllers:
    wordpress:
      enabled: true
      type: deployment
      strategy: Recreate
      replicas: 1
      pod:
        securityContext:
          fsGroup: 33
          fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        fix-permissions:
          image:
            repository: busybox
            tag: 1.37.0
          command:
            - sh
            - -c
            - |
              mkdir -p /var/www/html/wp-content
              chown -R 33:33 /var/www/html/wp-content
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        wordpress:
          image:
            repository: wordpress
            tag: 7.1.4
            pullPolicy: IfNotPresent
          env:
            WORDPRESS_DB_HOST: wordpress-mysql
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: wp-mysql-secret
                  key: mysql-secret

            WORDPRESS_CONFIG_EXTRA: |
              define('WP_HOME', 'https://dev.mildlyimpressivemedia.com');
              define('WP_SITEURL', 'https://dev.mildlyimpressivemedia.com');
              define('WP_AUTO_UPDATE_CORE', false);
              define('DISABLE_WP_CRON', true);
              $_SERVER['HTTPS'] = 'on';

            WORDPRESS_TABLE_PREFIX: wp_
            WORDPRESS_DEBUG: "0"

          # auth keys and salts (wp-salts, from Vault)
          envFrom:
            - secretRef:
                name: wp-salts

          probes:
            liveness:
              enabled: true
              type: TCP
              spec:
                initialDelaySeconds: 120
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
            readiness:
              enabled: true
              type: HTTP
              # static file served by Apache; a PHP path returns 503 while WordPress is in maintenance mode (theme/plugin updates)
              path: /wp-includes/images/blank.gif
              spec:
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi

          securityContext:
            runAsUser: 33  # www-data user
            runAsGroup: 33
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

    mysql:
      enabled: true
      type: deployment
      strategy: Recreate
      replicas: 1
      containers:
        mysql:
          image:
            repository: mariadb
            tag: "12.1.2"
            pullPolicy: IfNotPresent
          env:
            MYSQL_ROOT_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: wp-mysql-secret
                  key: mysql-secret
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: wp-mysql-secret
                  key: mysql-secret

          probes:
            startup:
              enabled: true
              type: TCP
              spec:
                periodSeconds: 10
                failureThreshold: 30
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - mariadb-admin
                    - ping
                    - -h
                    - localhost
                periodSeconds: 20
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              type: TCP
              spec:
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

          securityContext:
            runAsUser: 999  # mysql user
            runAsGroup: 999
            runAsNonRoot: true
            readOnlyRootFilesystem: false

  service:
    wordpress:
      controller: wordpress
      ports:
        http:
          port: 80
          targetPort: 80
          protocol: TCP
    mysql:
      controller: mysql
      ports:
        mysql:
          port: 3306
          targetPort: 3306
          protocol: TCP

  ingress:
    wordpress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 50M
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      hosts:
        - host: dev.mildlyimpressivemedia.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: wordpress
                port: http

  persistence:
    wordpress-content:
      enabled: true
      type: persistentVolumeClaim
      size: 10Gi
      storageClass: nfs-nosquash
      accessMode: ReadWriteOnce
      advancedMounts:
        wordpress:
          # only persist wp-content so core comes from the image
          wordpress:
            - path: /var/www/html/wp-content
          fix-permissions:
            - path: /var/www/html/wp-content
      retain: true

    php-config:
      enabled: true
      type: configMap
      name: wordpress
      advancedMounts:
        wordpress:
          wordpress:
            - path: /usr/local/etc/php/conf.d/custom.ini
              subPath: php.ini

    mysql-data:
      enabled: true
      type: persistentVolumeClaim
      size: 5Gi
      storageClass: nfs-client
      accessMode: ReadWriteOnce
      advancedMounts:
        mysql:
          mysql:
            - path: /var/lib/mysql
      retain: true

  # ConfigMaps for additional configuration
  configMaps:
    php-config:
      enabled: true
      data:
        php.ini: |
          memory_limit = 256M
          upload_max_filesize = 64M
          post_max_size = 64M
          max_execution_time = 300
          max_input_vars = 3000
