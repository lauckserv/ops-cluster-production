apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wp-prod-external

spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: wp-mysql-secret
  data:

  - secretKey: mysql-secret
    remoteRef:
      key: kubernetes/prod/wp-moonfb-recruiting
      property: mysql-secret